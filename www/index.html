<script type="text/plain" id="gs">// Excel AutoFill - cầu nối Google Sheets + Drive. Đổi SECRET trước khi triển khai.
const SECRET = 'DOI_MA_NAY';
const FOLDER = 'ExcelAutoFill', FILE = 'autofill-data.json';

function doGet() { return ContentService.createTextOutput('OK'); }

function doPost(e) {
  let out;
  try {
    const q = JSON.parse(e.postData.contents);
    if (q.secret !== SECRET) throw new Error('Sai mã bí mật (SECRET)');
    const fn = { ping: ping, read: read, write: write, save: save, load: load }[q.action];
    if (!fn) throw new Error('Hành động không hợp lệ');
    out = fn(q); out.ok = true;
  } catch (err) { out = { ok: false, error: String(err.message || err) }; }
  return ContentService.createTextOutput(JSON.stringify(out)).setMimeType(ContentService.MimeType.JSON);
}

function quota() { return { limit: DriveApp.getStorageLimit(), used: DriveApp.getStorageUsed() }; }
function ping() { return { quota: quota(), user: Session.getEffectiveUser().getEmail() }; }

function sheetOf(q) {
  const ss = SpreadsheetApp.openById(q.id), g = q.gid === '' || q.gid == null ? null : Number(q.gid);
  return (g === null ? null : ss.getSheets().filter(s => s.getSheetId() === g)[0]) || ss.getSheets()[0];
}
function read(q) {
  const s = sheetOf(q);
  return { values: s.getDataRange().getDisplayValues(), title: s.getParent().getName() + ' / ' + s.getName() };
}
function write(q) {
  const s = sheetOf(q);
  q.cells.forEach(c => s.getRange(c.r, c.c).setNumberFormat('@').setValue(String(c.v)));
  SpreadsheetApp.flush();
  return { n: q.cells.length };
}

function dataFile(create) {
  const it = DriveApp.getFoldersByName(FOLDER);
  const dir = it.hasNext() ? it.next() : (create ? DriveApp.createFolder(FOLDER) : null);
  if (!dir) return null;
  const f = dir.getFilesByName(FILE);
  return f.hasNext() ? f.next() : (create ? dir.createFile(FILE, '{}', 'application/json') : null);
}
function save(q) {
  const f = dataFile(true);
  f.setContent(JSON.stringify(q.data));
  return { id: f.getId(), size: f.getSize(), updated: f.getLastUpdated().getTime(), quota: quota() };
}
function load() {
  const f = dataFile(false);
  if (!f) return { data: null, quota: quota() };
  return { data: JSON.parse(f.getBlob().getDataAsString()), size: f.getSize(), updated: f.getLastUpdated().getTime(), quota: quota() };
}
</script>

 const t=await r.text();let j;try{j=JSON.parse(t)}catch(e){throw new Error('Apps Script trả về sai định dạng. Kiểm tra URL /exec và quyền "Bất kỳ ai"')}
 if(!j.ok)throw new Error(j.error||'Lỗi Apps Script');return j}
async function fetchSheet(link){const m=link.match(/\/d\/([\w-]+)/);if(!m)throw new Error('Link không phải Google Sheets');
 const id=m[1],gid=(link.match(/[#&?]gid=(\d+)/)||[])[1]||'';let V=null,title='';
 try{const r=await fetch(`https://docs.google.com/spreadsheets/d/${id}/export?format=csv${gid?'&gid='+gid:''}`);const t=await r.text();
  if(r.ok&&!/^\s*<(!doctype|html)/i.test(t))V=parseCSV(t)}catch(e){}
 if(!V&&linked()){const j=await gs('read',{id,gid});V=j.values;title=j.title}
 if(!V)throw new Error('Không đọc được bảng. Mở quyền "Bất kỳ ai có link" hoặc đăng nhập Google ở mục Drive.');
 return{id,gid,V,title}}

 V.map((r,i)=>`<tr data-r="${i}"><td class="rn">${i+1}</td>`+Array.from({length:w},(_,c)=>`<td data-c="${c}">${esc(r[c])}</td>`).join('')+'</tr>').join('')+'</tbody></table>'}
const cell=(el,r,c)=>el.querySelector(`tr[data-r="${r}"] td[data-c="${c}"]`);
function focusRow(el,r){const o=el.querySelector('tr.cur');o&&o.classList.remove('cur');const tr=el.querySelector(`tr[data-r="${r}"]`);if(tr){tr.classList.add('cur');el.scrollTop=tr.offsetTop-el.clientHeight/2}}
function findPerson(name){const a=nk(name),b=tk(name);return DB.people.find(p=>nk(p.name)==a)||DB.people.find(p=>tk(p.name)==b)}
const live=(p,msg,f,cnt)=>{$(`#${p}-msg`).innerHTML=msg;$(`#${p}-bar`).style.width=Math.round(f*100)+'%';$(`#${p}-cnt`).textContent=cnt||''};

async function runImport(){const link=$('#i-link').value.trim();if(!link)return toast('Dán link bảng vào trước nhé','warn');

  const A=analyze(S.V);if(!A)throw new Error('Không thấy cột "Họ và tên" trong 25 dòng đầu của bảng');
  const nf=[];A.cols.forEach(c=>{if(!DB.fields.some(f=>f.k==c.k)){DB.fields.push({k:c.k,label:c.label});nf.push(c.label)}});

   rows.push(!p||bad.length?{name,st:'bad',detail:'Lệch: '+(bad.join(', ')||'không thấy trong app')}:tot?{name,st:'ok',detail:`${okc}/${tot} mục khớp`}:{name,st:'warn',detail:'Bảng chưa có thông tin của người này'});await sleep(8)}
  let drv='';if(DB.cfg.auto&&linked()){try{const d=await driveSync();drv=d.ok?' · Drive: đã lưu và khớp':' · Drive: lưu nhưng chưa khớp'}catch(e){drv=' · Drive lỗi: '+e.message}}
  renderRes('i',rows);live('i',`Xong. Đã kiểm tra ${N} người`,1,'');
  addReport({type:'import',title:S.title||'Bảng Google Sheets',rows,extra:`Người mới: ${created} · Mục mới: ${nf.length}${drv}`})
 }catch(e){fail('i',e)}finally{end('i')}}

async function runFill(){const link=$('#f-link').value.trim();if(!link)return toast('Dán link bảng cần điền','warn');
 if(!linked()){toast('Cần đăng nhập Google ở mục Drive để ghi vào bảng','warn');return go('drive')}
 if(!DB.people.length)return toast('Chưa có thông tin nào được lưu','warn');
 if(!start('f'))return;DB.cfg.lf=link;save();
 try{live('f','Đang tải bảng…',.03);const S=await fetchSheet(link),el=$('#f-sheet');mkSheet(el,S.V);
  const A=analyze(S.V);if(!A)throw new Error('Không thấy cột "Họ và tên" trong 25 dòng đầu của bảng');
  const over=$('#f-over').checked,N=A.rows.length,rows=[],written=[];
  for(let n=0;n<N;n++){const{r,name}=A.rows[n];focusRow(el,r);live('f',`Đang điền: <b>${esc(name)}</b>`,(n+1)/N,`${n+1}/${N} người`);
   const row={name};rows.push(row);const p=findPerson(name);

    cells.push({r:r+1,c:c.c+1,v:val,ri:r,ci:c.c,label:c.label})});

   Object.assign(row,{st:conf.length||miss.length?'warn':'ok',detail:[cells.length&&`điền ${cells.length} ô`,same.length&&`${same.length} ô đã đúng`,conf.length&&`ô đã có dữ liệu khác: ${conf.join(', ')}`,miss.length&&`app chưa có: ${miss.join(', ')}`].filter(Boolean).join(' · ')||'Không có gì để điền'})}

   written.forEach(x=>{const got=String((back[x.ri]||[])[x.ci]??'').trim(),td=cell(el,x.ri,x.ci);td&&td.classList.remove('fill');
    if(got===x.v)td&&td.classList.add('ok');else{td&&td.classList.add('bad');x.row.st='bad';x.row.detail+=` · KHÔNG KHỚP ${x.label} (bảng đang có "${got}")`}})}
  renderRes('f',rows);live('f',`Xong. Đã điền ${written.length} ô cho ${N} người`,1,'');
  addReport({type:'fill',title:S.title||'Bảng Google Sheets',rows,extra:`Đã điền ${written.length} ô`+(over?' · chế độ ghi đè':'')})
 }catch(e){fail('f',e)}finally{end('f')}}

 $('#d-auto').onchange=e=>{DB.cfg.auto=e.target.checked;save()};
 if(c.tok){$('#d-out').onclick=()=>{DB.cfg.tok=null;DB.cfg.email='';save();renderDrive();toast('Đã đăng xuất')}}
 else{$('#d-login').onclick=async()=>{DB.cfg.cid=$('#d-cid').value.trim();save();try{await googleLogin()}catch(e){toast(e.message,'bad')}}}
 $('#d-copy').onclick=async()=>{const t=$('#gs').textContent.trim();try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast('Đã sao chép mã','ok')};
 const cfg=()=>{DB.cfg.url=$('#d-url').value.trim();DB.cfg.secret=$('#d-sec').value.trim();save()};
 $('#d-test').onclick=async()=>{cfg();try{const j=await gs('ping');DB.quota=j.quota;save();renderDrive();toast('Đã kết nối: '+j.user,'ok')}catch(e){toast(e.message,'bad')}};
 $('#d-save').onclick=async()=>{cfg();const b=$('#d-save');b.disabled=true;b.textContent='Đang lưu và kiểm tra…';try{const d=await driveSync(true);toast(d.ok?'Đã lưu và khớp với Drive':'Lưu xong nhưng có chỗ chưa khớp',d.ok?'ok':'warn')}catch(e){toast(e.message,'bad');renderDrive()}};
 $('#d-load').onclick=async()=>{cfg();try{await driveLoad()}catch(e){toast(e.message,'bad')}}
 $('#d-upd').onclick=()=>checkUpdate(true)}
/* ---- tự cập nhật qua GitHub Releases ---- */
let UPD=null;
async function checkUpdate(manual){
 if(!APP_BUILD||REPO.indexOf('/')<1){if(manual)toast('Bản này chưa hỗ trợ tự cập nhật','warn');return}
 try{const r=await fetch(`https://api.github.com/repos/${REPO}/releases/latest`);if(!r.ok)throw new Error(r.status==404?'Repo cần để công khai (Public) và đã có bản phát hành':'Lỗi '+r.status);
  const j=await r.json(),v=parseInt(String(j.tag_name).replace(/\D/g,''))||0,a=(j.assets||[]).find(x=>/\.apk$/i.test(x.name));
  if(v>APP_BUILD&&a){UPD={v,url:a.browser_download_url};const u=$('#upd');u.hidden=false;u.innerHTML=`<span>Có bản mới: <b>bản ${v}</b> (đang dùng bản ${APP_BUILD})</span><button class="btn" id="u-go">Cập nhật</button>`;
   $('#u-go').onclick=()=>{toast('Đang mở trang tải. Tải xong mở file để cài đè.','ok');const B=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Browser;try{B?B.open({url:UPD.url}):(location.href=UPD.url)}catch(e){location.href=UPD.url}}}
  else if(manual)toast('Đang là bản mới nhất','ok')}
 catch(e){if(manual)toast(e.message||'Không kiểm tra được cập nhật','bad')}}
/* ---- khởi động ---- */
function pane(p,btn,hint,extra){return `<div class="card"><label>Link bảng Google Sheets</label><div class="row"><input class="in" id="${p}-link" placeholder="Dán link bảng vào đây" inputmode="url" autocomplete="off"><button class="btn" id="${p}-go">${btn}</button></div>${extra||''}<div class="hint">${hint}</div></div>
<div class="card" id="${p}-live" hidden><div class="msg" id="${p}-msg"></div><div class="bar"><b id="${p}-bar"></b></div><div class="sub" id="${p}-cnt" style="margin:0"></div><div class="sheet" id="${p}-sheet"></div></div>
<div class="card" id="${p}-out" hidden><h3>Kết quả kiểm tra</h3><div class="chips" id="${p}-sum"></div><div id="${p}-res"></div></div>`}
$('#t-import').innerHTML=pane('i','Lấy','Bảng cần mở quyền “Bất kỳ ai có link”, hoặc đăng nhập Google ở mục Drive. Mục như CCCD, SĐT được tự thêm vào app.');
$('#t-fill').innerHTML=pane('f','Điền','Ghi vào bảng cần đăng nhập Google (mục Drive). Mặc định chỉ điền ô trống.','<label class="chk"><input type="checkbox" id="f-over"> Ghi đè cả ô đã có dữ liệu</label>');
$('#i-link').value=DB.cfg.li||'';$('#f-link').value=DB.cfg.lf||'';
$('#i-go').onclick=runImport;$('#f-go').onclick=runFill;
$('#nav').innerHTML=TABS.map(t=>`<button data-t="${t[0]}">${IC[t[0]]}<span>${t[1]}</span></button>`).join('');
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));
$('#s-q').oninput=renderPeople;$('#p-add').onclick=()=>openEdit();$('#p-fld').onclick=openFields;
$('#p-list').onclick=e=>{const c=e.target.closest('.pc');c&&openEdit(c.dataset.id)};
$('#modal').onclick=e=>{if(e.target.id=='modal')closeM()};
try{const A=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App;A&&A.addListener('appUrlOpen',e=>onRedirect(e.url))}catch(e){}
go('import');badge();setTimeout(()=>checkUpdate(false),1500);
if(linked())gs('ping').then(j=>{DB.quota=j.quota;save();if(cur=='drive')renderDrive()}).catch(()=>{});
</script></body></html>
